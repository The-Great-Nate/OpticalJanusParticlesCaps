beams:
  beam_1:
    beamtype: BEAMTYPE_PLANE # parameter
    E0: 1.000e+06
    translation: 0.0 0.0 0.0 # translation in meters or None
    rotation: 0.0 0.0 # x rotation followed by z rotation in degrees or None
    jones: POLARISATION_LCP
  beam_2:
   beamtype: BEAMTYPE_PLANE # parameter
   E0: 1.000e+06
   translation: 0.0 0.0 0.0 # translation in meters or None
   rotation: 180.0 0.0 # x rotation followed by z rotation in degrees or None
   jones: POLARISATION_RCP
particles:
  default_radius: 2e-07
  default_material: FusedSilica
  particle_list:
    particle_0:
      material1: FusedSilica
      material2: Diamond
      coords: 0.0 0.0 0.0 
      #coords: -5.3348e-10 -3.0569e-11 2.1470e-06
    particle_1:
      material1: Sapphire
      material2: Silicon
      coords: 1.0e-6 0.0 0.0
      orientation: 0.92388 0.0 0.0 0.38268 # Should orientatio be controlled based on dipoles above x axis? Or should it be a parameter in the yml file? Or should it be a parameter in the yml file that controls the initial dipole orientation?
    particle_2:
      material1: Titania
      material2: Air
      coords: 2.0e-6 1.0e-6 1.0e-6
      orientation: 0.7071 0.0 0.7071 0.0 # Should orientatio be controlled based on dipoles above x axis? Or should it be a parameter in the yml file? Or should it be a parameter in the yml file that controls the initial dipole orientation?
