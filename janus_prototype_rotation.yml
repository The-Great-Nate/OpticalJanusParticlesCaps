simulation:
  frames: 1000
  include_dynamics: True
  dynamics_method: ONLY_OPTICS
  include_springs: False
  include_bending: False
  include_nonbonded: True
  include_optics: True
  include_rotation: False
  optics_method: SH_DDA
parameters:
  wavelength: 0.785e-6 # meters in vacuum
  dipole_radius: 55e-9 # meters
  time_step: 1e-4 # seconds
output:
  vmd_output: False
  excel_output: False
  hdf_output: False
  include_force: True
  include_couple: False
display:
  show_output: True
  frame_interval: 10
  max_size: 20e-6 # range will be 2 times this
  resolution: 201 # number of points in each direction of plot
  frame_min: 0 # starting frame for animation
  frame_max: 5000 # will default to number of frames
  z_offset: 0.0e-6
beams:
  beam_1:
    beamtype: BEAMTYPE_GAUSS_CSP # parameter
    E0: 3.000e+06
    w0: 3.44 # fraction of wavelength
    translation: 0.0 0.0 -50e-6 # translation in meters or None
    rotation: 0.0 0.0 # x rotation followed by z rotation in degrees or None
#  beam_2:
#    beamtype: BEAMTYPE_GAUSS_CSP # parameter
#    E0: 4.000e+06
#    w0: 3.44 # fraction of wavelength
#    translation: 0.0 0.0 -5e-5 # translation in meters or None
#    rotation: 180.0 0.0 # x rotation followed by z rotation in degrees or None
particles:
  default_radius: 2e-07
  default_material: Sapphire
  particle_list:
    particle_0:
      material1: FusedSilica
      material2: Diamond
      coords: -1.0e-6 -1.0e-6 0
    particle_1:
      material1: Silicon
      material2: Sapphire
      coords: -1.0e-06 1.0e-6 0
    particle_2:
      material1: SiN
      material2: Glass
      coords: 1.0e-6 1.0e-6 0
    particle_3:
      material1: LeadGlass
      material2: Low
      coords: 1.0e-6 -1.0e-6 0
    particle_4:
      material1: Chromium
      material2: Titania
      coords: 0 0 0
