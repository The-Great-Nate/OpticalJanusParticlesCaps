simulation:
  frames: 24000
  include_dynamics: True
  dynamics_method: OSEEN
  include_springs: False
  include_bending: False
  include_nonbonded: True
  include_optics: True
  optics_method: SH_DDA
parameters:
  wavelength: 0.785e-6 # meters in vacuum
  dipole_radius: 125e-9 # meters
  time_step: 1e-5 # seconds
output:
  vmd_output: False
  excel_output: False
  hdf_output: True
  include_force: True
  include_couple: False
display:
  show_output: True
  frame_interval: 10 
  max_size: 20e-6 # range will be 2 times this
  resolution: 201 # number of points in each direction of plot
  frame_min: 0 # starting frame for animation
  frame_max: 24000 # will default to number of frames
  z_offset: 0.0e-6
beams:
  beam_1:
    beamtype: BEAMTYPE_PLANE # parameter
    E0: 0.500e+06
    translation: 0.0 0.0 0.0 # translation in meters or None
    rotation: 0.0 0.0 # x rotation followed by z rotation in degrees or None
    jones: POLARISATION_LCP
  beam_2:
   beamtype: BEAMTYPE_PLANE # parameter
   E0: 0.500e+06
   translation: 0.0 0.0 0.0 # translation in meters or None
   rotation: 180.0 0.0 # x rotation followed by z rotation in degrees or None
   jones: POLARISATION_RCP
