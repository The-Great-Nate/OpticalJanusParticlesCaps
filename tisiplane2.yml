#============================================================================================
# Dipole Multi Program Suite configuration file
# Version 1.0 16/07/24
#============================================================================================
# Beam type parameters: BEAMTYPE_PLANE, BEAMTYPE_GAUSS_BARTON5, BEAMTYPE_GAUSS_CSP,
#   BEAMTYPE_BESSEL, BEAMTYPE_LAGUERRE_GAUSSIAN
#============================================================================================
# Jones vector names: POLARISATION_X, POLARISATION_Y, POLARISATION_RCP, POLARISATION_LCP,
#   POLARISATION_RADIAL, POLARISATION_AZIMUTHAL
#============================================================================================
# System options
#============================================================================================
# dynamics_method names: OSEEN, ROTNE_PRAGER, SHAKE_HI
# optics_method names: SH_DDA, MOSH_DDA, SH_DDA_NI (non-interacting)
#============================================================================================
simulation:
  frames: 1000
  include_dynamics: True
  dynamics_method: BD_TRANS_SHAKE_HI
  hi_method: OSEEN
  include_springs: False
  include_bending: False
  include_nonbonded: False
  include_optics: True
  include_wall: False
  optics_method: SH_DDA
#============================================================================================
# System parameters
#============================================================================================
parameters:
  wavelength: 1.064e-6 # meters in vacuum
  dipole_radius: 60e-9 # meters
  time_step: 2e-4 # seconds
  spring_stiffness: 1e-4 # N/m
  bending_stiffness: 1e-19 # bending units
  wall_position: 1.5e-6 # m along z axis
  wall_force_max: 2e-12 # N
  wall_order: 2 # positive integer
  wall_zrange: 1e-6 # m along z axis
#============================================================================================
# Output parameters
#============================================================================================
output:
  vmd_output: True
  excel_output: True
  include_force: True
  include_couple: False
#============================================================================================
# Display parameters
#============================================================================================
display:
  show_output: False
  frame_interval: 1
  max_size: 4e-6 # range will be 2 times this
  resolution: 201 # number of points in each direction of plot
  frame_min: 0 # starting frame for animation
  frame_max: 1000 # will default to number of frames
  z_offset: 0.0e-6
#============================================================================================
# Beam descriptions
#============================================================================================
beams:
  beam_1:
    beamtype: BEAMTYPE_PLANE # parameter
    E0: 3e6
    #order: 10
    #w0: 0.4 # fraction of wavelength
    jones: POLARISATION_X # parameter
    translation: None # translation in meters or None
    rotation: 0 0 # x rotation followed by z rotation in degrees or None
  beam_2:
    beamtype: BEAMTYPE_PLANE # parameter
    E0: 3e6
    #order: 10
    #w0: 0.4 # fraction of wavelength
    jones: POLARISATION_X # parameter
    translation: None # translation in meters or None
    rotation: 180 0 # x rotation followed by z rotation in degrees or None
#============================================================================================
# Particle descriptions
#============================================================================================
particles:
  default_radius: 500e-9
  default_material: Diamond
  particle_list:
    part_1:
      material: FusedSilica
      radius: 450e-9
      coords: -0.475e-6 0.0e-06 0e-06
      altcolour: True
    part_2:
      material: HighTitania
      radius: 450e-9
      coords: 0.475e-6 0E-06 0E-06
      altcolour: False
    #part_3:
    #  coords: -1e-6 0.0 0.0
    #part_4:
#============================================================================================
# Topology description
#============================================================================================
topology:
  topotype: DIMERS
  particle_separation: 0.95e-6
